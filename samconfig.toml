version = 0.1

# ── Development environment ────────────────────────────────────────────────────
[dev.deploy.parameters]
stack_name          = "unit-converter-dev"
s3_bucket           = "unit-converter-sam-artifacts-dev-${AWS_ACCOUNT_ID}"
s3_prefix           = "unit-converter"
region              = "us-east-1"
confirm_changeset   = false
capabilities        = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev"

# ── Production environment ─────────────────────────────────────────────────────
[prod.deploy.parameters]
stack_name          = "unit-converter-prod"
s3_bucket           = "unit-converter-sam-artifacts-prod-${AWS_ACCOUNT_ID}"
s3_prefix           = "unit-converter"
region              = "us-east-1"
confirm_changeset   = false
capabilities        = "CAPABILITY_IAM"
parameter_overrides = "Environment=prod"
