name: Deploy — Prod

on:
  push:
    branches: [main]

# Prevent concurrent deploys to production
concurrency:
  group: deploy-prod
  cancel-in-progress: false   # queue, don't cancel, for prod safety

jobs:
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    environment: prod           # requires manual approval in GitHub Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Create SAM artifact bucket if it doesn't exist
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          BUCKET="unit-converter-sam-artifacts-prod-${AWS_ACCOUNT_ID}"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              $([ "$AWS_REGION" != "us-east-1" ] && echo "--create-bucket-configuration LocationConstraint=$AWS_REGION")

      - name: SAM Build
        run: sam build

      - name: SAM Deploy — Prod
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sam deploy \
            --config-env prod \
            --s3-bucket "unit-converter-sam-artifacts-prod-${AWS_ACCOUNT_ID}" \
            --no-fail-on-empty-changeset

      - name: Print deployed URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name unit-converter-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text
